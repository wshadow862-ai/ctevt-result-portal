<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTEVT Quick Result Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">
    <div class="max-w-xl mx-auto w-full p-6 mt-10 bg-white rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold text-center text-blue-900 mb-2">CTEVT Result Portal</h1>
        <p class="text-center text-gray-500 text-sm mb-6">Enter your Symbol Number to check instant results and marksheet.</p>
        
        <form id="searchForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Symbol Number</label>
                <input type="text" id="symbolNo" required placeholder="e.g. 01009988" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Date of Birth (YYYY-MM-DD)</label>
                <input type="date" id="dob" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition">Check Marksheet</button>
        </form>

        <div id="resultCard" class="mt-6 hidden p-5 border rounded-lg bg-slate-50"></div>
    </div>

    <footer class="text-center py-4 text-xs text-gray-500">
        &copy; 2026 CTEVT Result Portal. All rights reserved.
    </footer>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const symbol = document.getElementById('symbolNo').value;
            const dob = document.getElementById('dob').value;
            const resultCard = document.getElementById('resultCard');
            
            resultCard.classList.remove('hidden');
            resultCard.innerHTML = `<p class="text-center text-blue-600">Searching result...</p>`;

            try {
                const res = await fetch(`/api/result/search?symbol=${symbol}&dob=${dob}`);
                const data = await res.json();

                if(data.success) {
                    const st = data.data;
                    resultCard.innerHTML = `
                        <div class="border-b pb-3 mb-3">
                            <h3 class="font-bold text-lg text-blue-900">${st.name}</h3>
                            <p class="text-sm text-gray-600">Program: ${st.program}</p>
                            <p class="text-sm text-gray-600">Symbol No: ${st.symbolNo}</p>
                        </div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="px-3 py-1 rounded text-sm font-bold ${st.status === 'PASSED' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${st.status}</span>
                            <span class="font-bold text-gray-800">GPA: ${st.gpa}</span>
                        </div>
                        <p class="text-xs text-gray-500 text-center">Institute: ${st.institute}</p>
                    `;
                } else {
                    resultCard.innerHTML = `<p class="text-red-600 text-center">${data.error}</p>`;
                }
            } catch(err) {
                resultCard.innerHTML = `<p class="text-red-600 text-center">Server connection error.</p>`;
            }
        });
    </script>
</body>
</html>
